<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Casamento</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #fdf6f0;
      text-align: center;
      color: #333;
    }

    header {
      background: #c49a6c;
      color: white;
      padding: 50px 20px;
    }

    h1 {
      margin: 0;
      font-size: 3em;
    }

    section {
      padding: 40px 20px;
    }

    .box {
      max-width: 600px;
      margin: auto;
    }

    button {
      background: #c49a6c;
      color: white;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 16px;
    }

    input {
      padding: 10px;
      width: 80%;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>Carolina & Rafael</h1>
  <p>Vamos casar!</p>
</header>

<section>
  <div class="box">
    <h2>📅 Data</h2>
    <p>24 de Abril de 2028</p>
  </div>
</section>

<section>
  <div class="box">
    <h2>📍 Local</h2>
    <p>Quinta do Marquês</p>
  </div>
</section>

<section>
  <div class="box">
    <h2>💌 Confirma a tua presença</h2>
    
    <!-- FORMULÁRIO GRÁTIS COM FORMSPREE -->
    <form action="https://formspree.io/f/yourcode" method="POST">
      <input type="text" name="nome" placeholder="O teu nome" required><br>
      <button type="submit">Confirmar</button>
    </form>
    
  </div>
</section>

<section>
  <div class="box">
    <h2>❤️ A nossa história</h2>
    <p>Foi amor à primeira vista... e agora vamos celebrar juntos.</p>
  </div>
</section>

</body>
</html>
