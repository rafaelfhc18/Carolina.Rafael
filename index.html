<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carolina & Rafael</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #fdf6f0;
  text-align: center;
  color: #333;
}

header {
  background: url('https://images.unsplash.com/photo-1520854221256-17451cc331bf') center/cover;
  color: white;
  padding: 100px 20px;
}

h1 {
  font-size: 3em;
  margin: 0;
}

section {
  padding: 50px 20px;
}

.box {
  max-width: 700px;
  margin: auto;
}

.countdown {
  font-size: 2em;
  margin-top: 20px;
  color: #c49a6c;
}

iframe {
  width: 100%;
  height: 300px;
  border: none;
  border-radius: 10px;
}

@media (max-width: 600px) {
  h1 {
    font-size: 2em;
  }
}
</style>
</head>

<body>

<header>
  <h1>Carolina & Rafael</h1>
  <p>25 de Maio de 2028</p>
</header>

<section>
  <div class="box">
    <h2>⏳ Contagem decrescente</h2>
    <div id="countdown" class="countdown"></div>
  </div>
</section>

<section>
  <div class="box">
    <h2>📍 Local</h2>
    <p>Quinta do Moinho</p>

    <!-- MAPA -->
    <iframe
      src="https://www.google.com/maps?q=Quinta%20do%20Moinho&output=embed">
    </iframe>

  </div>
</section>

<section>
  <div class="box">
    <h2>💌 Confirma a tua presença</h2>

    <form action="https://formspree.io/f/yourcode" method="POST">
      <input type="text" name="nome" placeholder="O teu nome" required><br><br>
      <button type="submit">Confirmar</button>
    </form>

  </div>
</section>

<section>
  <div class="box">
    <h2>❤️ A nossa história</h2>
    <p>Depois de muitas aventuras juntos, chegou o momento de celebrar o nosso amor com todos vocês.</p>
  </div>
</section>

<script>
// DATA DO CASAMENTO
const weddingDate = new Date("May 25, 2028 00:00:00").getTime();

const countdown = setInterval(() => {
  const now = new Date().getTime();
  const distance = weddingDate - now;

  const days = Math.floor(distance / (1000 * 60 * 60 * 24));
  const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
  const minutes = Math.floor((distance / (1000 * 60)) % 60);
  const seconds = Math.floor((distance / 1000) % 60);

  document.getElementById("countdown").innerHTML =
    days + "d " + hours + "h " + minutes + "m " + seconds + "s ";

  if (distance < 0) {
    clearInterval(countdown);
    document.getElementById("countdown").innerHTML = "É hoje! 🎉";
  }
}, 1000);
</script>

</body>
</html>
